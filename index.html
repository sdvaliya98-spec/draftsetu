    <script>
        // Initializing progress simulation for instant loading feel
        (function () {
            const progressEl = document.getElementById('splash-progress');
            const statusEl = document.getElementById('splash-status');
            let progress = 10;

            const messages = [
                "Connecting to database...",
                "Loading Gujarati language library...",
                "Resolving document structures...",
                "Preparing layout templates...",
                "Bootstrapping application..."
            ];

            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.floor(Math.random() * 12) + 5;
                    if (progress > 90) progress = 90;
                    if (progressEl) progressEl.style.width = progress + '%';

                    // Update status message
                    const msgIdx = Math.min(Math.floor((progress - 10) / 16), messages.length - 1);
                    if (statusEl && messages[msgIdx]) {
                        statusEl.innerText = messages[msgIdx];
                    }
                }
            }, 100);

            window.hideSplashScreen = function () {
                clearInterval(interval);
                if (progressEl) progressEl.style.width = '100%';
                if (statusEl) statusEl.innerText = "Loaded successfully!";

                setTimeout(() => {
                    const splash = document.getElementById('splash-screen');
                    if (splash) {
                        splash.style.opacity = '0';
                        splash.style.visibility = 'hidden';
                        setTimeout(() => {
                            if (splash && splash.parentNode) splash.remove();
                        }, 250);
                    }
                }, 100);
            };

            // Safety fallback: auto-hide splash screen after 3 seconds max
            setTimeout(() => {
                if (typeof window.hideSplashScreen === 'function') {
                    window.hideSplashScreen();
                }
            }, 3000);
        })();
    </script>

    <script>
        // Force 127.0.0.1 for local development to avoid IPv6 resolution issues (localhost vs ::1)
        const hostname = window.location.hostname;
        const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
        // window.API_BASE = isLocal ? "http://127.0.0.1:8000" : `http://${hostname}:8000`;

        window.API_BASE = (isLocal && window.location.port && window.location.port !== '8080' && window.location.port !== '80')
            ? "http://127.0.0.1:8000"
            : "";
        window.apiFetch = async (path, options = {}, retries = 2) => {
            const cleanPath = path.startsWith('/') ? path : `/${path}`;
            const url = `${window.API_BASE}${cleanPath}`;
            const isFormData = options.body instanceof FormData;
            const headers = { ...options.headers };
            if (!isFormData && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
            let token = null;
            try { token = localStorage.getItem('authToken'); } catch (e) { console.warn("⚠️ [STORAGE] Blocked access to localStorage:", e.message); }
            if (token && !headers['Authorization']) headers['Authorization'] = `Bearer ${token}`;
            const fetchOptions = { ...options, headers };
            if (fetchOptions.body && typeof fetchOptions.body === 'object' && !isFormData) {
                fetchOptions.body = JSON.stringify(fetchOptions.body);
            }

            const executeFetch = async (attempt) => {
                try {
                    const res = await fetch(url, fetchOptions);
                    if (!res.ok) {
                        let errorData = {};
                        try { errorData = await res.json(); } catch (e) {
                            const text = await res.text().catch(() => "Unknown Error");
                            errorData = { detail: text };
                        }
                        const error = new Error(errorData.detail || `Server Error (${res.status})`);
                        error.status = res.status;
                        error.data = errorData;
                        throw error;
                    }
                    return res;
                } catch (err) {
                    if (err.name === 'TypeError' || err.message.includes('Failed to fetch')) {
                        console.error(`❌ [API NETWORK ERROR] ${cleanPath}:`, err);
                        if (attempt < retries) {
                            const delay = Math.pow(2, attempt) * 1000;
                            await new Promise(r => setTimeout(r, delay));
                            return executeFetch(attempt + 1);
                        }
                        const offlineErr = new Error("SERVER_OFFLINE");
                        offlineErr.originalError = err;
                        throw offlineErr;
                    }

                    const isRetryableStatus = err.status >= 500 && err.status <= 504;
                    if (isRetryableStatus && attempt < retries) {
                        const delay = Math.pow(2, attempt) * 1000;
                        await new Promise(r => setTimeout(r, delay));
                        return executeFetch(attempt + 1);
                    }

                    console.error(`❌ [API ERR] ${cleanPath}:`, err.message);
                    throw err;
                }
            };
            return executeFetch(0);
        };

        window.checkBackendHealth = async () => {
            try {
                const res = await fetch(`${window.API_BASE}/health`);
                const data = await res.json();
                return res.ok && (data.status === 'ok' || data.status === 'online');
            } catch (e) { return false; }
        };
    </script>

    <!-- React 18 & ReactDOM -->

    <!-- React 18 Compatibility Shim for Recharts / hoist-non-react-statics -->
    <!-- hoist-non-react-statics (bundled in Recharts) accesses React.ForwardRef and React.Memo -->
    <!-- as Symbol keys — these are internal in React 18 but must be shimmed for UMD compat -->
    <script>
        (function () {
            if (!window.React) return;
            try {
                // Shim React internal Symbols that hoist-non-react-statics needs
                if (!React.ForwardRef) React.ForwardRef = Symbol.for('react.forward_ref');
                if (!React.Memo) React.Memo = Symbol.for('react.memo');
                if (!React.Fragment) React.Fragment = Symbol.for('react.fragment');
                if (!React.Portal) React.Portal = Symbol.for('react.portal');
                if (!React.Profiler) React.Profiler = Symbol.for('react.profiler');
                if (!React.StrictMode) React.StrictMode = Symbol.for('react.strict_mode');
                if (!React.Suspense) React.Suspense = Symbol.for('react.suspense');
                if (!React.ContextProvider) React.ContextProvider = Symbol.for('react.provider');
                if (!React.ContextConsumer) React.ContextConsumer = Symbol.for('react.context');
            } catch (e) {
                console.warn('[Shim] React compat shim failed:', e.message);
            }
        })();
    </script>
