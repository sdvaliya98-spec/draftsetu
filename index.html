<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DraftSetu - Professional Legal Document Automation Platform</title>

    <!-- Google Fonts: Comprehensive Font Collection (Outfit, Inter & Noto Sans Gujarati) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Gujarati:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/style.css">

    <style>
        /* CKEditor Custom Styling if referenced */
        .ck-editor__editable {
            min-height: 250px !important;
            font-family: 'Noto Sans Gujarati', sans-serif !important;
            font-size: 16px !important;
            line-height: 1.6 !important;
        }

        .ck-content {
            font-family: 'Noto Sans Gujarati', sans-serif !important;
        }

        .ck.ck-editor__main>.ck-editor__editable:not(.ck-focused) {
            border-color: #d1d5db !important;
        }

        .ck.ck-editor__main>.ck-editor__editable.ck-focused {
            border-color: #1e3a8a !important;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1) !important;
        }

        .ck.ck-toolbar {
            background: #f9fafb !important;
            border-top-left-radius: 8px !important;
            border-top-right-radius: 8px !important;
            border-color: #d1d5db !important;
        }

        .ck-editor__editable_inline {
            border-bottom-left-radius: 8px !important;
            border-bottom-right-radius: 8px !important;
        }
    </style>

</head>

<body class="bg-gray-100 min-h-screen text-gray-800 font-gujarati">
    <!-- Premium Loading Splash Screen -->
    <div id="splash-screen"
        style="position: fixed; inset: 0; background: linear-gradient(135deg, #0b0f19 0%, #1e1b4b 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.4s ease, visibility 0.4s ease; font-family: 'Outfit', 'Inter', sans-serif;">
        <div
            style="text-align: center; color: white; display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 450px; padding: 2rem;">
            <!-- Logo Icon with Animation -->
            <div
                style="font-size: 5rem; line-height: 1; margin-bottom: 0.5rem; filter: drop-shadow(0 10px 15px rgba(59, 130, 246, 0.35)); animation: float 3s ease-in-out infinite;">
                ⚖️</div>

            <!-- Welcome Title -->
            <h1
                style="font-size: 2.25rem; font-weight: 900; letter-spacing: -0.025em; margin: 0; background: linear-gradient(to right, #60a5fa, #c7d2fe); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Welcome to DraftSetu</h1>

            <!-- Subtitle -->
            <p
                style="font-size: 0.875rem; font-weight: 700; color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase; margin: 0;">
                Smart Legal Document Automation Platform</p>

            <!-- Loading Progress Bar -->
            <div
                style="width: 240px; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px; overflow: hidden; margin-top: 2rem;">
                <div id="splash-progress"
                    style="width: 60%; height: 100%; background: linear-gradient(to right, #3b82f6, #6366f1); border-radius: 9999px; transition: width 0.3s ease;">
                </div>
            </div>

            <!-- Telemetry Status Message -->
            <p id="splash-status"
                style="font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin: 0; min-height: 1.5rem;">
                Loading platform...</p>
        </div>
    </div>
    <style>
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
    <script>
        // Splash screen immediate controller (Zero artificial delay)
        (function () {
            const progressEl = document.getElementById('splash-progress');
            const statusEl = document.getElementById('splash-status');

            window.hideSplashScreen = function () {
                if (progressEl) progressEl.style.width = '100%';
                if (statusEl) statusEl.innerText = "Ready";

                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.transition = 'opacity 0.2s ease, visibility 0.2s ease';
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                    setTimeout(() => {
                        if (splash && splash.parentNode) splash.remove();
                    }, 200);
                }
            };

            // Safety fallback: auto-hide splash screen after 5 seconds max if React fails
            setTimeout(() => {
                if (typeof window.hideSplashScreen === 'function') {
                    window.hideSplashScreen();
                }
            }, 5000);
        })();
    </script>

    <!-- Main React App root container -->
    <div id="root"></div>

    <script>
        // Force 127.0.0.1 for local development to avoid IPv6 resolution issues (localhost vs ::1)
        const hostname = window.location.hostname;
        const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';

        window.API_BASE = (isLocal && window.location.port && window.location.port !== '8080' && window.location.port !== '80' && window.location.port !== '3000')
            ? "http://127.0.0.1:8000"
            : "";

        window.apiFetch = async (path, options = {}, retries = 2) => {
            const cleanPath = path.startsWith('/') ? path : `/${path}`;
            const url = `${window.API_BASE}${cleanPath}`;
            const isFormData = options.body instanceof FormData;
            const headers = { ...options.headers };
            if (!isFormData && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
            let token = null;
            try { token = localStorage.getItem('authToken'); } catch (e) { console.warn("⚠️ [STORAGE] Blocked access to localStorage:", e.message); }
            if (token && !headers['Authorization']) headers['Authorization'] = `Bearer ${token}`;
            const fetchOptions = { ...options, headers };
            if (fetchOptions.body && typeof fetchOptions.body === 'object' && !isFormData) {
                fetchOptions.body = JSON.stringify(fetchOptions.body);
            }

            const executeFetch = async (attempt) => {
                try {
                    const res = await fetch(url, fetchOptions);
                    if (!res.ok) {
                        let errorData = {};
                        try { errorData = await res.json(); } catch (e) {
                            const text = await res.text().catch(() => "Unknown Error");
                            errorData = { detail: text };
                        }
                        const error = new Error(errorData.detail || `Server Error (${res.status})`);
                        error.status = res.status;
                        error.data = errorData;
                        throw error;
                    }
                    return res;
                } catch (err) {
                    if (err.name === 'TypeError' || err.message.includes('Failed to fetch')) {
                        console.error(`❌ [API NETWORK ERROR] ${cleanPath}:`, err);
                        if (attempt < retries) {
                            const delay = Math.pow(2, attempt) * 1000;
                            await new Promise(r => setTimeout(r, delay));
                            return executeFetch(attempt + 1);
                        }
                        const offlineErr = new Error("SERVER_OFFLINE");
                        offlineErr.originalError = err;
                        throw offlineErr;
                    }

                    const isRetryableStatus = err.status >= 500 && err.status <= 504;
                    if (isRetryableStatus && attempt < retries) {
                        const delay = Math.pow(2, attempt) * 1000;
                        await new Promise(r => setTimeout(r, delay));
                        return executeFetch(attempt + 1);
                    }

                    console.error(`❌ [API ERR] ${cleanPath}:`, err.message);
                    throw err;
                }
            };
            return executeFetch(0);
        };

        window.checkBackendHealth = async () => {
            try {
                const res = await fetch(`${window.API_BASE}/health`);
                const data = await res.json();
                return res.ok && (data.status === 'ok' || data.status === 'online');
            } catch (e) { return false; }
        };

        // Dynamic Script & Stylesheet Loaders for On-Demand Libraries
        window.loadScript = function (src) {
            if (document.querySelector(`script[src="${src}"]`)) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = () => resolve();
                s.onerror = (e) => reject(new Error(`Failed to load script: ${src}`));
                document.head.appendChild(s);
            });
        };

        window.loadStylesheet = function (href) {
            if (document.querySelector(`link[href="${href}"]`)) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const l = document.createElement('link');
                l.rel = 'stylesheet';
                l.href = href;
                l.onload = () => resolve();
                l.onerror = (e) => reject(new Error(`Failed to load stylesheet: ${href}`));
                document.head.appendChild(l);
            });
        };

        // 1. On-Demand Docx Preview & JSZip Loader
        window.loadDocxPreview = async function () {
            if (!window.JSZip) {
                await window.loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
            }
            if (!window.docx) {
                await window.loadScript("https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.min.js");
            }
            return window.docx;
        };

        // 2. On-Demand Recharts Loader for Admin Analytics
        window.loadRecharts = async function () {
            if (window.Recharts?.ResponsiveContainer) return window.Recharts;
            await window.loadScript("https://unpkg.com/prop-types@15.8.1/prop-types.min.js");
            await window.loadScript("https://unpkg.com/recharts@2.10.3/umd/Recharts.js");
            return window.Recharts;
        };

        // 3. On-Demand Flatpickr Datepicker Loader
        window.loadFlatpickr = async function () {
            if (window.flatpickr) return window.flatpickr;
            await window.loadStylesheet("https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css");
            await window.loadScript("https://cdn.jsdelivr.net/npm/flatpickr");
            return window.flatpickr;
        };

        window.Recharts = window.Recharts || {};
    </script>

    <!-- Vite compiled frontend entry point -->
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
